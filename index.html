<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="成交學堂·台灣">
<meta name="theme-color" content="#0B7A78">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>成交學堂·台灣</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&family=LXGW+WenKai+TC&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#E8F1EF; --panel:#FFFFFF; --panel-2:#F1F7F6; --ink:#10302F; --ink-2:#44605E; --ink-3:#526C6A; --line:#CBDCD9;
  --pri:#0A7270; --pri-d:#064E4C; --pri-2:#D3EFEC; --on-pri:#FFFFFF;
  --sun:#F5B820; --sun-2:#FFF1C9; --mint:#23813F; --mint-d:#17622E; --mint-2:#DDF3E3;
  --amber:#B8730A; --amber-2:#FFF0D4; --violet:#6F58F0; --violet-2:#ECE8FF; --red:#C9353E; --red-d:#9E232B; --red-2:#FDE2E3;
  --ice:#2B6FA8; --ice-2:#E1EEFA;
  --card:#FFFFFF; --off:#C5D3D0; --off-d:#A5B6B2; --tip-bg:#10302F; --tip-line:transparent;
  --mint-t:#1D6B33; --red-t:#A8262E; --amber-t:#7A4E00; --violet-t:#4B36C4; --sun-t:#7A5200;
  --shadow:0 2px 0 rgba(16,48,47,.08), 0 10px 28px -14px rgba(16,48,47,.30);
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  --f-ui:'Nunito','Noto Sans TC','Noto Sans SC','PingFang TC','Microsoft JhengHei',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-zh:'Noto Sans TC','Noto Sans SC','PingFang TC','Microsoft JhengHei','Heiti TC',sans-serif;
  --f-disp:'Baloo 2','Nunito','Noto Sans TC','Noto Sans SC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --f-logo:'LXGW WenKai TC','Noto Sans TC','Noto Sans SC','PingFang TC','Microsoft JhengHei',serif;
}

@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark;
  --bg:#0C1B1C; --panel:#142628; --panel-2:#1B3234; --card:#183032; --ink:#E6F2F0; --ink-2:#AFC7C4; --ink-3:#8EACA9; --line:#2C4749;
  --pri:#3CC4BE; --pri-d:#1F8A86; --pri-2:#143B3A; --on-pri:#05201F; --sun:#F5B820; --sun-2:#3A2F12; --mint:#4CC26E; --mint-d:#2E8F4B; --mint-2:#143523;
  --amber:#F0A53A; --amber-2:#3A2F19; --violet:#8C79FF; --violet-2:#2A2650; --red:#F0565E; --red-d:#B93940; --red-2:#442229; --ice:#6FAEEC; --ice-2:#1D3147;
  --off:#2F4749; --off-d:#213435; --tip-bg:#050D0E; --tip-line:#2F4749;
  --mint-t:#8BE3A4; --red-t:#FF9EA4; --amber-t:#F4C86F; --violet-t:#BDB1FF; --sun-t:#F6D27A;
  --shadow:0 2px 0 rgba(0,0,0,.28), 0 10px 28px -14px rgba(0,0,0,.7); } }
:root[data-theme="dark"]{ color-scheme:dark;
  --bg:#0C1B1C; --panel:#142628; --panel-2:#1B3234; --card:#183032; --ink:#E6F2F0; --ink-2:#AFC7C4; --ink-3:#8EACA9; --line:#2C4749;
  --pri:#3CC4BE; --pri-d:#1F8A86; --pri-2:#143B3A; --on-pri:#05201F; --sun:#F5B820; --sun-2:#3A2F12; --mint:#4CC26E; --mint-d:#2E8F4B; --mint-2:#143523;
  --amber:#F0A53A; --amber-2:#3A2F19; --violet:#8C79FF; --violet-2:#2A2650; --red:#F0565E; --red-d:#B93940; --red-2:#442229; --ice:#6FAEEC; --ice-2:#1D3147;
  --off:#2F4749; --off-d:#213435; --tip-bg:#050D0E; --tip-line:#2F4749;
  --mint-t:#8BE3A4; --red-t:#FF9EA4; --amber-t:#F4C86F; --violet-t:#BDB1FF; --sun-t:#F6D27A;
  --shadow:0 2px 0 rgba(0,0,0,.28), 0 10px 28px -14px rgba(0,0,0,.7); }
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{font-family:var(--f-disp);line-height:1.15;text-wrap:balance;margin:0}
.zh{font-family:var(--f-zh)}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.hint{font-size:12.5px;color:var(--ink-3);font-weight:700}
.panel{background:var(--panel);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.btn{border:0;border-radius:16px;padding:13px 26px;font-family:var(--f-disp);font-weight:700;font-size:18px;background:var(--pri);color:var(--on-pri);box-shadow:0 4px 0 var(--pri-d);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pri-d)}
.btn:disabled{background:var(--off);box-shadow:0 4px 0 var(--off-d);color:var(--ink-3);cursor:default}
.btn.ok{background:var(--mint);box-shadow:0 4px 0 var(--mint-d)}
.btn.bad{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.btn.ghost{background:var(--panel);color:var(--ink);box-shadow:inset 0 0 0 2px var(--line),0 3px 0 var(--line)}
.btn .zh{font-weight:700}
.link{border:0;background:none;color:var(--ink-3);font-weight:800;font-size:13px;text-decoration:underline;padding:4px}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px}
.hud-in{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;background:var(--panel);border-radius:var(--r-lg);padding:8px 12px;box-shadow:var(--shadow)}
.logo{font-family:var(--f-logo);font-size:24px;line-height:1;color:var(--pri);border:0;background:none;padding:2px 4px}
.hud-mid{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.toggles{display:flex;gap:6px;margin-left:auto}
.tg{border:0;border-radius:99px;padding:6px 11px;font-size:13px;font-weight:800;background:var(--panel-2);color:var(--ink-3);box-shadow:inset 0 0 0 1.5px var(--line);display:flex;align-items:center;gap:5px}
.tg[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}
.tg svg{width:15px;height:15px}
.xbtn{border:0;background:none;width:34px;height:34px;border-radius:10px;color:var(--ink-3);display:grid;place-items:center}
.xbtn svg{width:20px;height:20px}
.prog{flex:1;height:14px;border-radius:99px;background:var(--panel-2);box-shadow:inset 0 0 0 1.5px var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--mint);border-radius:99px;transition:width .4s ease;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.hearts{display:flex;align-items:center;gap:2px;font-weight:800;color:var(--red)}
.hearts svg{width:18px;height:18px}
.hearts .off{color:var(--off)}
.hearts .lbl{font-family:var(--f-zh);font-size:12px;color:var(--ink-2);margin-right:4px}

/* ruby words + tooltip */
.zb{border-radius:8px}
.zb .z{font-family:var(--f-zh);font-weight:500;display:block;line-height:1.65}
.show-py .zb .z,.zb.open .z{line-height:2.15}
.zb .e{display:none;font-size:13.5px;line-height:1.4;color:var(--ink-2);margin-top:2px}
.show-en .zb .e,.zb.open .e{display:block}
.zb.noen .e{display:none!important}
ruby.w{ruby-position:over;cursor:help;border-radius:5px;padding:0 1px;transition:background .12s}
ruby.w:hover,ruby.w.on{background:var(--sun-2)}
ruby.w rt{display:none;font-family:var(--f-ui);font-size:.46em;font-weight:700;color:var(--ink-3);opacity:.85;letter-spacing:-.01em;user-select:none}
.show-py ruby.w rt,.zb.open ruby.w rt{display:ruby-text}
.hid{visibility:hidden}
.cursor::after{content:'▍';color:var(--pri);animation:blink .8s steps(2) infinite;font-weight:400}
@keyframes blink{50%{opacity:0}}
#tip{position:fixed;z-index:50;max-width:260px;background:var(--tip-bg);border:1px solid var(--tip-line);color:#fff;border-radius:12px;padding:8px 12px;box-shadow:0 10px 30px -10px rgba(30,43,69,.6);pointer-events:none;display:grid;gap:1px}
#tip[hidden]{display:none!important}
#tip b{font-family:var(--f-zh);font-size:20px;font-weight:700;line-height:1.3}
#tip i{font-style:normal;color:#FFD98A;font-weight:800;font-size:14px}
#tip span{font-size:13px;line-height:1.35;color:#E3E9F2}
.say{border:0;width:38px;height:38px;border-radius:12px;background:var(--ice-2);color:var(--ice);display:inline-grid;place-items:center;flex:none;vertical-align:middle}
.say svg{width:20px;height:20px}

/* home */
.home{display:grid;gap:14px;margin-top:4px}
.career{padding:18px 20px;display:grid;gap:12px}
.career-top{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.rank{font-family:var(--f-zh);font-weight:700;font-size:22px}
.rank small{display:block;font-family:var(--f-ui);font-size:12px;color:var(--ink-3);font-weight:800}
.quota{flex:1;min-width:200px;display:grid;gap:4px}
.quota .row{display:flex;justify-content:space-between;font-size:12px;font-weight:800;color:var(--ink-2)}
.quota .row b{font-family:var(--f-disp);font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.qbar{height:12px;border-radius:99px;background:var(--panel-2);box-shadow:inset 0 0 0 1.5px var(--line);overflow:hidden}
.qbar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--pri));border-radius:99px}
.leads{display:flex;align-items:center;gap:12px;padding:14px 18px;flex-wrap:wrap}
.leads .ico{width:44px;height:44px;border-radius:14px;background:var(--ice-2);color:var(--ice);display:grid;place-items:center;flex:none}
.leads .ico svg{width:26px;height:26px}
.leads .txt{flex:1;min-width:180px}
.leads .txt b{font-family:var(--f-zh);font-size:16px}
.leads .txt div{font-size:13px;color:var(--ink-2)}
.leads .btn{font-size:15px;padding:9px 18px;border-radius:12px;background:var(--ice);color:var(--on-pri);box-shadow:0 3px 0 var(--off-d)}
.units{display:grid;gap:14px}
.unit{display:grid;gap:4px}
.unit-h{width:100%;border:0;text-align:left;padding:16px 20px;border-radius:var(--r-lg);background:var(--pri);color:var(--on-pri);display:flex;gap:12px;align-items:center;box-shadow:0 4px 0 var(--pri-d)}
.unit-h .eyebrow{color:var(--on-pri);opacity:.85}
.unit-h.won{background:var(--mint);box-shadow:0 4px 0 var(--mint-d)}
.unit-h.locked{background:var(--panel-2);color:var(--ink-3);box-shadow:inset 0 0 0 2px var(--line);cursor:default}
.unit-h.locked .eyebrow{color:var(--ink-3)}
.uh-txt{flex:1;min-width:0}
.uh-side{display:flex;align-items:center;gap:10px;flex:none}
.uh-st{font-size:12px;font-weight:800;background:rgba(0,0,0,.16);border-radius:99px;padding:4px 10px;white-space:nowrap}
.unit-h.locked .uh-st{background:var(--panel)}
.chev{font-size:18px;line-height:1}
@media (max-width:640px){ .unit-h{flex-wrap:wrap} .uh-side{width:100%;justify-content:space-between} }
.unit-h h2{font-size:22px}
.unit-h .zh{font-weight:700}
.unit-h p{margin:2px 0 0;font-size:13px;opacity:.92;font-weight:700}
.path{display:grid;justify-items:center;gap:16px;padding-block:14px 8px;overflow:hidden}
.pnode{display:flex;align-items:center;gap:14px;width:min(100%,380px);transform:translateX(calc(var(--x) - 50px))}
@media (max-width:640px){.pnode{transform:translateX(calc(var(--x) * .3));width:calc(100% - 36px)}}
.pbtn{flex:none;width:76px;height:70px;border-radius:50%;border:0;display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;font-size:26px;color:var(--on-pri);background:var(--off);box-shadow:0 6px 0 var(--off-d);position:relative}
.pbtn svg.ck{width:34px;height:34px}
.pbtn.done{background:var(--sun);box-shadow:0 6px 0 #C58F0E}
.pbtn.cur{background:var(--pri);box-shadow:0 6px 0 var(--pri-d)}
.pbtn.cur::after{content:'';position:absolute;inset:-9px;border-radius:50%;border:4px solid var(--pri);opacity:.35;animation:ring 1.6s ease-in-out infinite}
@keyframes ring{50%{transform:scale(1.07);opacity:.15}}
.pbtn.boss{width:88px;height:82px;overflow:hidden;background:var(--panel);box-shadow:0 6px 0 var(--off-d),inset 0 0 0 4px var(--off)}
.pbtn.boss.cur{box-shadow:0 6px 0 var(--pri-d),inset 0 0 0 4px var(--pri)}
.pbtn.boss.done{box-shadow:0 6px 0 #C58F0E,inset 0 0 0 4px var(--sun)}
.pbtn.boss svg{width:88px;height:100px;margin-top:14px}
.pbtn:disabled{cursor:default}
.plabel b{display:block;font-family:var(--f-zh);font-size:17px}
.plabel span{font-size:13px;color:var(--ink-2);font-weight:700}
.plabel .st{display:inline-block;margin-top:3px;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.teasers{display:grid;gap:8px}
.teaser{display:flex;gap:10px;align-items:center;padding:12px 16px;border-radius:var(--r-md);background:var(--panel-2);box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink-3);font-weight:700}
.teaser b{font-family:var(--f-zh);color:var(--ink-2)}
.teaser svg{width:16px;height:16px;flex:none}
.foot{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding-top:6px}

/* lesson */
.lesson{display:grid;gap:18px;margin-top:6px;padding-bottom:45vh}
.q-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.q-h h2{font-size:24px}
.q-h .zh{font-size:15px;color:var(--ink-3);font-weight:700}
.card{padding:18px 20px}
.intro-word{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.intro-word .zb .z{font-size:36px;font-weight:700}
.intro-word .en{font-family:var(--f-disp);font-size:20px;font-weight:700;color:var(--ink-2)}
.newtag{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--sun-t);background:var(--sun-2);border-radius:99px;padding:3px 10px}
.example{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding-top:14px;border-top:1.5px dashed var(--line)}
.example .zb .z{font-size:19px}
.note{margin:12px 0 0;padding:10px 12px;border-radius:var(--r-sm);background:var(--panel-2);font-size:14px;color:var(--ink-2)}
.prompt{display:flex;gap:12px;align-items:flex-start}
.prompt .zb .z{font-size:22px}
.prompt .en-big{font-family:var(--f-disp);font-size:22px;font-weight:700}
.bubble-row{display:flex;gap:10px;align-items:flex-end}
.av{width:54px;height:62px;flex:none;border-radius:16px;background:var(--panel-2);overflow:hidden}
.av svg{width:54px;height:64px;display:block}
.sbub{position:relative;background:var(--card);border-radius:18px;padding:12px 16px;box-shadow:var(--shadow);flex:1}
.sbub .zb .z{font-size:19px}
.bubble-row.saysp{align-items:flex-start}
.bubble-row.saysp .sbub{padding:12px 16px;min-width:0;overflow-wrap:anywhere}
.bubble-row.saysp .sbub::before{content:"";position:absolute;left:-7px;top:20px;width:14px;height:14px;background:var(--card);transform:rotate(45deg);border-radius:3px}
.bubble-row.saysp .sbub .en-big{font-size:20px;line-height:1.5}
.hw{border:0;background:none;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer;text-decoration:underline dotted;text-decoration-thickness:2px;text-underline-offset:5px}
.hw[aria-expanded="true"]{background:var(--ice-2);color:var(--ice);border-radius:6px;box-shadow:0 0 0 3px var(--ice-2)}
.hw:focus-visible,.mic:focus-visible{outline:3px solid var(--ice);outline-offset:2px;border-radius:6px}
.hwpop{display:flex;flex-wrap:wrap;gap:6px;margin-top:-6px}.hwpop:empty{display:none}
.qwrap{display:grid;gap:6px;justify-items:start}
.hardb{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--red-2);color:var(--red-t);font-size:12px;font-weight:800;letter-spacing:.04em;box-shadow:inset 0 0 0 2px var(--red)}
.alsol{display:grid;gap:4px;margin-top:6px}.alsol .lbl{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.mic{flex:1 1 100%;display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:16px;padding:12px 18px;font-family:var(--f-disp);font-weight:800;font-size:16px;letter-spacing:.06em;background:var(--panel);color:var(--ice);box-shadow:inset 0 0 0 2px var(--line),0 3px 0 var(--line)}
.mic svg{width:24px;height:24px;flex:none}
.mic.on{background:var(--ice-2);box-shadow:inset 0 0 0 2px var(--ice),0 3px 0 var(--ice)}
.mic.on svg{animation:micp 1s ease-in-out infinite}
@keyframes micp{50%{transform:scale(1.25)}}
.footer-in.withmic .fb:empty{display:none}.footer-in.withmic .btn{flex:1 1 100%}
.choices{display:grid;gap:10px}
.choices.grid2{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.ch{position:relative;text-align:left;border:0;background:var(--panel);border-radius:var(--r-md);padding:12px 14px 12px 50px;box-shadow:inset 0 0 0 2px var(--line),0 3px 0 var(--line);min-height:52px;transition:transform .08s}
.ch:hover{background:var(--panel-2)}
.ch .k{position:absolute;left:12px;top:12px;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;font-size:13px;color:var(--ink-3);box-shadow:inset 0 0 0 1.5px var(--line)}
.ch .enl{font-weight:700;font-size:16px}
.ch .zb .z{font-size:17px}
.ch .sub{display:block;font-size:12.5px;color:var(--ink-3);font-weight:700}
.ch.sel{background:var(--ice-2);box-shadow:inset 0 0 0 2.5px var(--ice),0 3px 0 var(--ice)}
.ch.sel .k{color:var(--ice);box-shadow:inset 0 0 0 1.5px var(--ice)}
.ch.right{background:var(--mint-2);box-shadow:inset 0 0 0 2.5px var(--mint),0 3px 0 var(--mint)}
.ch.wrong{background:var(--red-2);box-shadow:inset 0 0 0 2.5px var(--red),0 3px 0 var(--red)}
.ch:disabled{cursor:default}
.blunt{display:flex;gap:10px;align-items:baseline;padding:10px 14px;border-radius:var(--r-md);background:var(--red-2)}
.blunt .lbl{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--red-t);flex:none}
.blunt .zb .z{text-decoration:line-through;text-decoration-color:rgba(222,66,74,.5);font-size:17px}
.slot{display:inline-block;min-width:64px;border-bottom:3px solid var(--ink-3);margin:0 4px;text-align:center;color:var(--ice);font-weight:700}
.slot.filled{border-color:var(--ice)}
/* build */
.ansline{min-height:64px;border-bottom:2px solid var(--line);border-top:2px solid var(--line);padding:10px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:52px}
.tile{border:0;background:var(--card);border-radius:12px;padding:8px 14px;box-shadow:inset 0 0 0 2px var(--line),0 3px 0 var(--line);font-family:var(--f-zh);font-size:19px;font-weight:500}
.tile.used{visibility:hidden}
.tile rt{font-size:.5em}
/* type */
.typebox{display:grid;gap:12px}
.typebox .target .z{font-size:30px;letter-spacing:.06em}
.typebox .target ruby.w.hit{color:var(--mint)}
.typebox .target .pu{color:var(--ink-3)}
.tin{width:100%;font:inherit;font-size:20px;font-weight:700;padding:14px 16px;border-radius:var(--r-md);border:2px solid var(--line);background:var(--card);color:var(--ink);letter-spacing:.03em}
.tin:focus{border-color:var(--ice);outline:none}
.tin.bad{border-color:var(--red)}
textarea.tin{resize:none;line-height:1.5;display:block;font-family:var(--f-zh),inherit}
.saybox{display:grid;gap:8px}
.srow{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.hchips{display:flex;flex-wrap:wrap;gap:6px}
.hchip{display:inline-flex;flex-direction:column;align-items:center;padding:6px 10px;border-radius:12px;background:var(--card);box-shadow:inset 0 0 0 2px var(--line);line-height:1.25;max-width:100%}
.hchip b{font-family:var(--f-zh);font-size:18px;font-weight:500}.hchip i{font-style:normal;font-size:12px;color:var(--ink-3);font-weight:700}.hchip span{font-size:12px;color:var(--ink-2);overflow-wrap:anywhere;text-align:center}
.sfix{display:flex;gap:10px;align-items:flex-start}.sfix .zb{min-width:0}
.sdiff{font-size:14px;font-weight:700;overflow-wrap:anywhere}.sdiff .lbl{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-right:6px}
.sdiff del{color:var(--red-t);text-decoration:line-through;text-decoration-color:var(--red);background:var(--red-2);border-radius:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex-basis:100%}
.chip{border:0;border-radius:999px;padding:5px 12px;font-weight:800;font-size:13px;background:var(--card);color:var(--ink-2);box-shadow:inset 0 0 0 2px var(--line)}
.chip[aria-pressed="true"]{background:var(--ice-2);color:var(--ice);box-shadow:inset 0 0 0 2px var(--ice)}
/* pairs */
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs .col{display:grid;gap:10px}
.pc{border:0;background:var(--card);border-radius:var(--r-md);padding:12px;min-height:56px;box-shadow:inset 0 0 0 2px var(--line),0 3px 0 var(--line);font-weight:700;font-size:15px}
.pc.zhc{font-family:var(--f-zh);font-size:20px;font-weight:500}
.pc.sel{background:var(--ice-2);box-shadow:inset 0 0 0 2.5px var(--ice),0 3px 0 var(--ice)}
.pc.done{opacity:.35;box-shadow:inset 0 0 0 2px var(--mint);background:var(--mint-2);cursor:default}
.pc.shake{animation:shake .35s;box-shadow:inset 0 0 0 2.5px var(--red),0 3px 0 var(--red)}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}

.footer{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--panel);border-top:2px solid var(--line);padding-block:14px calc(14px + env(safe-area-inset-bottom,0px))}
.footer.ok{background:var(--mint-2);border-color:var(--mint-2)}
.footer.bad{background:var(--red-2);border-color:var(--red-2)}
.footer-in{position:relative;max-width:760px;margin:0 auto;padding-inline:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pine-pop{position:absolute;right:16px;top:-4px;display:flex;align-items:center;gap:4px;font-family:var(--f-disp);font-weight:800;font-size:15px;color:var(--sun-t);pointer-events:none;animation:pineFloat 1.1s ease-out forwards}
.pine-pop svg{width:18px;height:18px}
@keyframes pineFloat{0%{opacity:0;transform:translateY(6px) scale(.8)}15%{opacity:1;transform:translateY(0) scale(1.05)}75%{opacity:1}100%{opacity:0;transform:translateY(-22px) scale(1)}}
.fb{flex:1;min-width:220px;display:grid;gap:4px}
.fb h3{font-size:21px}
.footer.ok .fb h3{color:var(--mint-t)}
.footer.bad .fb h3{color:var(--red-t)}
.fb .zb .z{font-size:16px}
.fb .why{margin:0;font-size:13.5px;color:var(--ink-2);max-width:62ch}
.fb-scroll{max-height:34vh;overflow:auto}

/* end screens */
.end{padding:28px 24px;display:grid;gap:16px;justify-items:center;text-align:center;margin-top:10px}
.end .big{font-family:var(--f-logo);font-size:clamp(44px,10vw,68px);line-height:1;color:var(--pri)}
.end h2{font-size:24px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;width:100%}
.stat{border-radius:var(--r-md);padding:12px;box-shadow:inset 0 0 0 2px var(--line)}
.stat b{display:block;font-family:var(--f-disp);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;font-weight:800;color:var(--ink-3)}

.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

.talking .mouth{animation:talk .16s steps(2) infinite}
@keyframes talk{50%{transform:scaleY(.3)}}
.talk{position:absolute;left:14px;top:14px;bottom:14px;width:min(56%,440px);display:flex;flex-direction:column;justify-content:space-between;gap:10px;overflow-y:auto;z-index:2}
.bubble{position:relative;background:var(--card);border-radius:20px;padding:12px 16px;box-shadow:var(--shadow)}

.bubble.me{background:var(--pri-2);align-self:flex-start}

.mtrack{position:relative;height:12px;border-radius:99px;background:var(--panel-2);box-shadow:inset 0 0 0 1.5px var(--line);margin-top:5px}

<script>(function(){'use strict';
var V=JSON.parse(document.getElementById('vault').textContent),$=function(i){return document.getElementById(i)},RK='cjtw-unlock',S=crypto.subtle;
function ls(f){try{return f(localStorage)}catch(e){return null}}
try{var th=JSON.parse(ls(function(l){return l.getItem('cjtw-settings')})||'{}').theme;if(th==='light'||th==='dark')document.documentElement.setAttribute('data-theme',th)}catch(e){}
function b2u(s){var r=atob(s),u=new Uint8Array(r.length);for(var i=0;i<r.length;i++)u[i]=r.charCodeAt(i);return u}
function u2b(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
async function dec(raw){var k=await S.importKey('raw',raw,'AES-GCM',false,['decrypt']);return JSON.parse(new TextDecoder().decode(await S.decrypt({name:'AES-GCM',iv:b2u(V.iv)},k,b2u(V.ct))))}
function run(p){document.body.insertAdjacentHTML('afterbegin',p.html);p.scripts.forEach(function(t){var s=document.createElement('script');s.textContent=t;document.body.appendChild(s)});
 $('lock').remove();var b=document.createElement('button');b.id='lk-lock';b.type='button';b.textContent='Lock this device';b.onclick=function(){ls(function(l){l.removeItem(RK)});location.replace(location.pathname+location.search)};document.body.appendChild(b)}
function show(){$('lock').hidden=false;$('pw').focus()}
(async function(){var r=ls(function(l){return l.getItem(RK)});if(r){try{run(await dec(b2u(r)));return}catch(e){ls(function(l){l.removeItem(RK)})}}show()})();
$('lf').addEventListener('submit',async function(ev){ev.preventDefault();var btn=$('go'),err=$('err'),card=$('lf');btn.disabled=true;err.textContent='';
 try{var pk=await S.importKey('raw',new TextEncoder().encode($('pw').value.normalize('NFKC')),'PBKDF2',false,['deriveBits']);
  var raw=new Uint8Array(await S.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b2u(V.salt),iterations:V.iter},pk,256));
  var p=await dec(raw);if($('rem').checked)ls(function(l){l.setItem(RK,u2b(raw))});run(p)}
 catch(e){err.textContent='Wrong passphrase';card.classList.remove('lk-shake');void card.offsetWidth;card.classList.add('lk-shake');$('pw').select();btn.disabled=false}});
try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}
})();</script>
